name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_test
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      TOKEN_ENCRYPTION_KEY: Zm9yLWNpLW9ubHktZG8tbm90LXVzZS1pbi1wcm9kLTE=
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra allanime
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Migrations match the models
        run: uv run alembic upgrade head && uv run alembic check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date
        run: |
          (cd apps/api && uv sync --frozen)
          pnpm gen:api
          git diff --exit-code packages/api-client
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
      - name: Keep the Playwright report when e2e fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  # Watch-together in two real browsers against the real API and a database.
  rooms-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: (cd apps/api && uv sync --frozen)
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e:rooms
      - name: Keep the Playwright report when e2e fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rooms-report
          path: apps/web/test-results
          retention-days: 7

  # The production stack must keep building: images, compose file and Caddy config.
  deploy:
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: https://ci.example.com
      POSTGRES_PASSWORD: ci
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      TOKEN_ENCRYPTION_KEY: Zm9yLWNpLW9ubHktZG8tbm90LXVzZS1pbi1wcm9kLTE=
      TUNNEL_TOKEN: ci
      COMPOSE_PROFILES: tunnel
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml config -q
      - run: docker compose -f deploy/compose.yaml -f deploy/compose.vps.yaml config -q
      - run: docker compose -f deploy/compose.yaml build api web
      - name: Caddyfile is valid
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
