services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 15

  api:
    build:
      context: apps/api
      args:
        EXTRAS: ${API_EXTRAS:-}
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  db-data:
